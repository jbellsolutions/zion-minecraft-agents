name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Agent Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          echo "Checking required files..."
          for f in CLAUDE.md AGENTS.md ARCHITECTURE.md ETHOS.md README.md CHANGELOG.md VERSION llms.txt features.json; do
            if [ -f "$f" ]; then
              echo "✅ $f"
            else
              echo "❌ $f MISSING"
              exit 1
            fi
          done

      - name: Check agent files exist
        run: |
          echo "Checking agent files..."
          for f in agents/orchestrator.md agents/mod-agent.md agents/world-builder.md agents/lore-agent.md agents/deploy-agent.md; do
            if [ -f "$f" ]; then
              echo "✅ $f"
            else
              echo "❌ $f MISSING"
              exit 1
            fi
          done

      - name: Check UI files exist
        run: |
          echo "Checking UI files..."
          for f in ui/index.html ui/server.py; do
            if [ -f "$f" ]; then
              echo "✅ $f"
            else
              echo "❌ $f MISSING"
              exit 1
            fi
          done

      - name: Check no secrets in tracked files
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          secret_regexes = [
              re.compile(r"sk-ant-[a-zA-Z0-9_\-]{20,}"),
              re.compile(r"AKIA[0-9A-Z]{16}"),
          ]
          extensions = {".py", ".js", ".ts", ".json"}
          skip_dirs = {".git", "node_modules", "__pycache__", "build", ".gradle"}
          for path in Path(".").rglob("*"):
              if path.suffix not in extensions:
                  continue
              if any(part in skip_dirs for part in path.parts):
                  continue
              text = path.read_text(errors="ignore")
              for pattern in secret_regexes:
                  match = pattern.search(text)
                  if match:
                      raise SystemExit(f"Potential real secret in {path}: {match.group()[:8]}...")
          print("✅ No real secrets detected")
          PY

      - name: Validate Python syntax
        run: |
          python3 -m py_compile ui/server.py tools/forge_asset_guard.py tools/hermes_datapack_guard.py && echo "✅ Python syntax OK"

      - name: Validate JSON files
        run: |
          for f in features.json genome/genome.json .claude/agi-1/baseline.json \
                   .claude/healing/history.json .claude/learning/observations.json; do
            if [ -f "$f" ]; then
              python3 -c "import json; json.load(open('$f'))" && echo "✅ $f valid JSON"
            fi
          done

      - name: Run smoke tests
        run: |
          python3 tests/test_smoke.py

      - name: Lint with ruff (if installed)
        run: |
          pip install ruff --quiet 2>/dev/null || true
          ruff check ui/server.py --select E,W,F --ignore E501 2>/dev/null && echo "✅ ruff passed" || echo "⚠️  ruff not available, skipping"
