name: Builder and Forge validation
on:
  push:
    branches: [main, codex/zion-supercharge]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-builder.txt
      - name: Builder regression tests
        run: python -m unittest discover -s tests -v
      - name: Repository smoke checks
        run: python tests/test_smoke.py
      - name: Inventory and resource references
        run: |
          python tools/forge_asset_guard.py --project mods/zion-supercharge --mod-id zion_showcase --fix
          python tools/forge_asset_guard.py --project zion-mc-agents/templates/forge-mod-template --fix
      - name: Credential scan
        run: python tools/check_public_secrets.py
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile pinned Forge release
        working-directory: mods/zion-supercharge
        run: ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: zion-supercharge-forge-1.21.4
          path: mods/zion-supercharge/build/libs/*.jar
