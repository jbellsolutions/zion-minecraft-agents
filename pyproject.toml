[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "W", "F", "I"]
ignore = ["E501"]
exclude = [".git", "__pycache__", "build", ".gradle"]

[tool.ruff.isort]
known-first-party = ["ui"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
