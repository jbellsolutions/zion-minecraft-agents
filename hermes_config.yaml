moa:
  default_preset: default
  presets:
    default:
      reference_models:
        - provider: openrouter
          model: deepseek/deepseek-v4-pro
        - provider: together
          model: MiniMaxAI/MiniMax-M3
      aggregator:
        provider: openrouter
        model: anthropic/claude-opus-4.8
      reference_temperature: 0.6
      aggregator_temperature: 0.4
      max_tokens: 4096
      enabled: true
